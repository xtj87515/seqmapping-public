# NOTE:
# This project requires external tools (not installable via pip):
#   - DIAMOND (>= 2.0)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqmapping"
version = "0.1.0"
description = "SeqMapping pipeline for PDB ↔ UniRef90 mapping"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "requests>=2.31",
  "biopython>=1.81",
  "pandas>=2.0",
  "pymongo>=4.6",
  "tqdm>=4.66",
  "parasail>=1.3",
]


